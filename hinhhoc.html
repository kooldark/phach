<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hình Học Vui Nhộn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #FFFFFF;
            font-family: 'Arial Rounded MT Bold', sans-serif;
        }

        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .shape {
            position: absolute;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .shape:hover {
            transform: scale(1.2) !important;
        }

        .circle {
            border-radius: 50%;
            animation: bounce 3s;
        }

        .square {
            animation: rotate 4s;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 87px solid;
            animation: wiggle 2s;
        }

        .star {
            animation: twinkle 2.5s;
        }

        .heart {
            animation: pulse 2s;
        }

        .face {
            position: absolute;
            color: white;
            font-size: 40px;
            text-align: center;
            line-height: 100px;
            animation: smile 3s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-30px) rotate(10deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-20px) rotate(-10deg); }
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.1); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg) translateX(-10px); }
            75% { transform: rotate(15deg) translateX(10px); }
        }

        @keyframes twinkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.7; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes smile {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media (max-width: 768px) {
            .shape {
                position: relative !important;
            }

            .container {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container"></div>

    <script>
        // ===== CẤU HÌNH CÀI ĐẶT =====
        const CONFIG = {
            // Thời gian chuyển hình (giây)
            autoChangeInterval: 3000,
            
            // Kích thước hình mặc định (px)
            defaultShapeSize: 200,
            mobileShapeSize: 150,
            smallMobileShapeSize: 120,
            
            // Kích thước chữ (px)
            defaultLabelSize: 48,
            mobileLabelSize: 36,
            smallMobileLabelSize: 28,
            
            // Breakpoint responsive (px)
            mobileBreakpoint: 768,
            smallMobileBreakpoint: 480,
            
            // Tỷ lệ kích thước theo màn hình
            desktopSizeRatio: 0.3,
            mobileSizeRatio: 0.35,
            smallMobileSizeRatio: 0.4,
            
            // Bán kính bo góc cho hình vuông
            squareBorderRadius: 0,
            
            // Tỷ lệ cho tam giác (căn 3)
            triangleRatio: 1.732
        };
        
        // ===== DỮ LIỆU HÌNH HỌC =====
        const shapes = [
            { type: 'circle', name: 'Hình Tròn', emoji: '🔴' },
            { type: 'square', name: 'Hình Vuông', emoji: '🟦' },
            { type: 'triangle', name: 'Hình Tam Giác', emoji: '🔺' },
            { type: 'star', name: 'Ngôi Sao', emoji: '⭐' },
            { type: 'heart', name: 'Trái Tim', emoji: '💖' }
        ];

        const colors = [
            '#FF6B6B',  // Đỏ soft
            '#D4956E',  // Cam soft
            '#FFD700',  // Vàng soft
            '#00DD77',  // Xanh lá soft
            '#00CCFF',  // Xanh xương soft
            '#DD77FF',  // Tím soft
            '#FF69B4',  // Hồng soft
            '#A9A9A9'   // Xám soft
        ];

        let currentIndex = 0;
        const container = document.getElementById('container');

        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function showShape(index) {
            container.innerHTML = '';
            const shapeData = shapes[index];
            const randomColor = getRandomColor();
            
            // Tính toán kích thước theo màn hình
            const isMobile = window.innerWidth <= CONFIG.mobileBreakpoint;
            const isSmallMobile = window.innerWidth <= CONFIG.smallMobileBreakpoint;
            let shapeSize = CONFIG.defaultShapeSize;
            let labelSize = CONFIG.defaultLabelSize;
            
            if (isSmallMobile) {
                shapeSize = Math.min(CONFIG.smallMobileShapeSize, window.innerWidth * CONFIG.smallMobileSizeRatio);
                labelSize = CONFIG.smallMobileLabelSize;
            } else if (isMobile) {
                shapeSize = Math.min(CONFIG.mobileShapeSize, window.innerWidth * CONFIG.mobileSizeRatio);
                labelSize = CONFIG.mobileLabelSize;
            } else {
                shapeSize = Math.min(CONFIG.defaultShapeSize, window.innerWidth * CONFIG.desktopSizeRatio);
                labelSize = CONFIG.defaultLabelSize;
            }
            
            const wrapper = document.createElement('div');
            wrapper.style.cssText = `
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                text-align: center;
                width: 100%;
                padding: 20px;
            `;

            const shapeElement = document.createElement('div');
            shapeElement.className = 'shape ' + shapeData.type;
            shapeElement.style.position = 'relative';
            shapeElement.style.margin = '0 auto 30px';
            
            if (shapeData.type === 'circle') {
                shapeElement.style.width = shapeSize + 'px';
                shapeElement.style.height = shapeSize + 'px';
                shapeElement.style.backgroundColor = randomColor;
                shapeElement.style.borderRadius = '50%';
            } else if (shapeData.type === 'square') {
                shapeElement.style.width = shapeSize + 'px';
                shapeElement.style.height = shapeSize + 'px';
                shapeElement.style.backgroundColor = randomColor;
                shapeElement.style.borderRadius = CONFIG.squareBorderRadius + 'px';
            } else if (shapeData.type === 'triangle') {
                const triangleSize = shapeSize / 2;
                shapeElement.style.borderLeftWidth = triangleSize + 'px';
                shapeElement.style.borderRightWidth = triangleSize + 'px';
                shapeElement.style.borderBottomWidth = (triangleSize * CONFIG.triangleRatio) + 'px';
                shapeElement.style.borderBottomColor = randomColor;
                shapeElement.style.borderLeftColor = 'transparent';
                shapeElement.style.borderRightColor = 'transparent';
            } else if (shapeData.type === 'star' || shapeData.type === 'heart') {
                shapeElement.style.fontSize = shapeSize + 'px';
                shapeElement.style.color = randomColor;
                shapeElement.textContent = shapeData.emoji;
                shapeElement.style.lineHeight = '1';
            }

            const label = document.createElement('div');
            label.style.cssText = `
                font-size: ${labelSize}px;
                color: #333;
                font-weight: bold;
                margin-top: 20px;
                word-wrap: break-word;
                max-width: 100%;
            `;
            label.textContent = shapeData.name;

            wrapper.appendChild(shapeElement);
            wrapper.appendChild(label);
            container.appendChild(wrapper);
        }

        function nextShape() {
            currentIndex = Math.floor(Math.random() * shapes.length);
            showShape(currentIndex);
        }

        // Hiển thị hình đầu tiên
        nextShape();

        // Tự động chuyển hình mỗi 3 giây
        setInterval(nextShape, CONFIG.autoChangeInterval);

        // Nhấn vào màn hình để chuyển hình
        container.addEventListener('click', nextShape);

        // Cập nhật lại khi thay đổi kích thước màn hình
        window.addEventListener('resize', () => {
            showShape(currentIndex);
        });
    </script>
</body>
</html>
