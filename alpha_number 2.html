<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bé Học Chữ & Số - Hiệu Ứng Vẽ Nét</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #f5f7fa; 
            font-family: 'Poppins', 'Quicksand', sans-serif; 
            overflow: hidden; 
            touch-action: manipulation;
        }

        .container {
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            transition: background 1s ease;
        }

        .card {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
        }

        .card.active { opacity: 1; pointer-events: auto; animation: slideIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .card.exit { animation: slideOut 0.5s ease-in forwards; }

        /* SVG Letter Styling */
        .letter-svg {
            width: clamp(150px, 40vw, 350px);
            height: auto;
            fill: none;
            stroke: currentColor;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }

        /* Hiệu ứng vẽ từ từ */
        .draw-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
        }

        .active .draw-path {
            animation: draw var(--draw-speed, 4s) linear forwards;
        }

        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { to { transform: translateX(-100px); opacity: 0; } }

        .emoji { font-size: clamp(80px, 20vw, 150px); margin-bottom: 20px; }
        .word { font-size: clamp(30px, 8vw, 60px); font-weight: 700; margin-top: 20px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        
        /* Numbers & Animals */
        .number-text { font-size: 150px; font-weight: 900; }
        .animals { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .animal { font-size: 50px; animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }

        /* UI Controls */
        .controls { position: fixed; bottom: 30px; display: flex; gap: 20px; z-index: 10; }
        button { 
            width: 60px; height: 60px; border-radius: 50%; border: none; 
            background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            font-size: 24px; cursor: pointer; 
        }
        .counter { position: fixed; top: 20px; left: 20px; background: white; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 18px; font-family: 'Poppins', 'Quicksand', sans-serif; }

        /* Màu sắc */
        .color-1 { background: #FFB3BA; color: #C62828; }
        .color-2 { background: #BAFFC9; color: #2E7D32; }
        .color-3 { background: #BAE1FF; color: #1565C0; }
        .color-4 { background: #FFFFBA; color: #F57F17; }
    </style>
</head>
<body>

    <div class="counter"><span id="curr">1</span> / <span id="total"></span></div>
    <div class="container" id="container"></div>

    <div class="controls">
        <button onclick="prev()">❮</button>
        <button id="playBtn" onclick="togglePlay()">▶</button>
        <button onclick="next()">❯</button>
    </div>

    <script>
        // Dữ liệu Path SVG cho bảng chữ cái (Tối giản để bé dễ đếm nét)
        const DATA = [
            { type: 'letter', char: 'A', emoji: '🍎', word: 'Apple', path: "M 50,10 L 15,90 M 50,10 L 85,90 M 25,65 L 75,65" },
            { type: 'letter', char: 'B', emoji: '🐻', word: 'Bear', path: "M 30,10 L 30,90 M 30,10 C 80,10 80,45 30,45 C 80,45 80,90 30,90" },
            { type: 'letter', char: 'C', emoji: '🐱', word: 'Cat', path: "M 75,15 C 50,15 20,30 20,50 C 20,70 50,85 75,85" },
            { type: 'letter', char: 'D', emoji: '🐶', word: 'Dog', path: "M 30,10 L 30,90 C 30,90 80,70 80,50 C 80,30 30,10 30,10" },
            { type: 'letter', char: 'E', emoji: '🐘', word: 'Elephant', path: "M 80,10 L 30,10 L 30,90 L 80,90 M 30,50 L 75,50" },
            { type: 'letter', char: 'F', emoji: '🐠', word: 'Fish', path: "M 30,10 L 30,90 M 30,10 L 80,10 M 30,50 L 75,50" },
            { type: 'letter', char: 'G', emoji: '🦒', word: 'Giraffe', path: "M 75,15 C 50,15 20,30 20,50 C 20,70 50,85 75,85 L 75,50 L 50,50" },
            { type: 'letter', char: 'H', emoji: '🏠', word: 'House', path: "M 30,10 L 30,90 M 80,10 L 80,90 M 30,50 L 80,50" },
            { type: 'letter', char: 'I', emoji: '🍦', word: 'Ice', path: "M 20,10 L 80,10 M 50,10 L 50,90 M 20,90 L 80,90" },
            { type: 'letter', char: 'J', emoji: '🪼', word: 'Jelly', path: "M 75,10 L 75,65 C 75,85 55,90 35,85 C 20,80 20,70 25,65" },
            { type: 'letter', char: 'K', emoji: '🪁', word: 'Kite', path: "M 30,10 L 30,90 M 80,20 L 30,50 L 80,80" },
            { type: 'letter', char: 'L', emoji: '🦁', word: 'Lion', path: "M 30,10 L 30,90 L 80,90" },
            { type: 'letter', char: 'M', emoji: '🐵', word: 'Monkey', path: "M 20,90 L 20,20 L 50,50 L 80,20 L 80,90" },
            { type: 'letter', char: 'N', emoji: '🪺', word: 'Nest', path: "M 30,90 L 30,20 L 75,75 L 75,10" },
            { type: 'letter', char: 'O', emoji: '🍊', word: 'Orange', path: "M 50,15 C 75,15 80,40 80,50 C 80,75 75,85 50,85 C 25,85 20,75 20,50 C 20,40 25,15 50,15" },
            { type: 'letter', char: 'P', emoji: '🐷', word: 'Pig', path: "M 30,90 L 30,10 C 30,10 80,10 80,40 C 80,55 55,55 30,55" },
            { type: 'letter', char: 'Q', emoji: '👑', word: 'Queen', path: "M 50,15 C 75,15 80,40 80,50 C 80,75 75,85 50,85 C 25,85 20,75 20,50 C 20,40 25,15 50,15 M 60,75 L 80,95" },
            { type: 'letter', char: 'R', emoji: '🐰', word: 'Rabbit', path: "M 30,90 L 30,10 C 30,10 80,10 80,40 C 80,55 50,55 30,55 M 55,55 L 80,90" },
            { type: 'letter', char: 'S', emoji: '☀️', word: 'Sun', path: "M 75,15 C 40,15 20,25 20,40 C 20,55 50,55 50,55 C 50,55 20,55 20,70 C 20,85 40,90 75,90" },
            { type: 'letter', char: 'T', emoji: '🐯', word: 'Tiger', path: "M 20,10 L 80,10 M 50,10 L 50,90" },
            { type: 'letter', char: 'U', emoji: '☂️', word: 'Umbrella', path: "M 30,10 L 30,70 C 30,85 50,90 50,90 C 50,90 70,85 70,70 L 70,10" },
            { type: 'letter', char: 'V', emoji: '🎻', word: 'Violin', path: "M 30,10 L 50,70 L 70,10" },
            { type: 'letter', char: 'W', emoji: '🐋', word: 'Whale', path: "M 20,10 L 30,80 L 50,40 L 70,80 L 80,10" },
            { type: 'letter', char: 'X', emoji: '🎵', word: 'Xylophone', path: "M 30,20 L 70,80 M 70,20 L 30,80" },
            { type: 'letter', char: 'Y', emoji: '🪀', word: 'Yo-yo', path: "M 30,10 L 50,50 L 70,10 M 50,50 L 50,90" },
            { type: 'letter', char: 'Z', emoji: '🦓', word: 'Zebra', path: "M 80,10 L 30,80 L 80,80 M 20,10 L 80,10 M 20,80 L 80,80" },
            { type: 'number', num: 1, name: 'MỘT', emoji: '🐶', path: "M 50,20 L 50,80" },
            { type: 'number', num: 2, name: 'HAI', emoji: '🐱'},
            { type: 'number', num: 3, name: 'BA', emoji: '🐰', path: "M 30,20 L 70,20 L 70,45 L 35,45 L 70,45 L 70,80 L 30,80" },
            { type: 'number', num: 4, name: 'BỐN', emoji: '🐻', path: "M 60,20 L 30,60 L 70,60 M 60,20 L 60,80" },
            { type: 'number', num: 5, name: 'NĂM', emoji: '🐸', path: "M 70,20 L 30,20 L 30,50 L 70,50 L 70,80 L 30,80" },
            { type: 'number', num: 6, name: 'SÁU', emoji: '🐢', path: "M 70,25 L 35,25 L 30,40 L 30,70 C 30,80 40,85 55,85 C 70,85 75,75 75,60 C 75,50 70,45 55,45 C 40,45 30,55 30,65" },
            { type: 'number', num: 7, name: 'BẢY', emoji: '🦋', path: "M 30,20 L 70,20 L 35,80" },
            { type: 'number', num: 8, name: 'TÁM', emoji: '🐙', path: "M 50,20 C 70,20 70,40 50,50 C 70,50 70,70 50,80 C 30,80 30,60 50,50 C 30,50 30,30 50,20" },
            { type: 'number', num: 9, name: 'CHÍN', emoji: '🍌', path: "M 30,80 L 70,80 L 70,20 C 70,20 30,30 30,45 C 30,60 70,50 70,50" },
            { type: 'number', num: 10, name: 'MƯỜI', emoji: '🍎', path: "M 30,25 L 30,75 M 55,30 C 70,30 75,40 75,50 C 75,65 70,80 55,80 C 40,80 35,65 35,50 C 35,40 40,30 55,30" }
        ];

        let index = 0;
        let playing = false;
        let timer = null;
        const container = document.getElementById('container');

        function render() {
            const item = DATA[index];
            document.getElementById('curr').innerText = index + 1;
            document.getElementById('total').innerText = DATA.length;
            
            const oldCard = container.querySelector('.card');
            if (oldCard) {
                oldCard.classList.remove('active');
                oldCard.classList.add('exit');
                setTimeout(() => oldCard.remove(), 500);
            }

            const card = document.createElement('div');
            card.className = `card active color-${(index % 4) + 1}`;
            
            // Tốc độ vẽ mặc định là 3 giây để bé đếm
            card.style.setProperty('--draw-speed', '3s');

            if (item.type === 'letter') {
                card.innerHTML = `
                    <div class="emoji">${item.emoji}</div>
                    <svg class="letter-svg" viewBox="0 0 100 100">
                        <path class="draw-path" d="${item.path}"></path>
                    </svg>
                    <div class="word">${item.word}</div>
                `;
            } else {
                let emojis = '';
                for (let i = 0; i < item.num; i++) {
                    emojis += `<span class="animal" style="animation-delay: ${i*0.2}s">${item.emoji}</span>`;
                }
                
                let svgContent = '';
                if (item.path) {
                    svgContent = `<svg class="letter-svg" viewBox="0 0 100 100">
                        <path class="draw-path" d="${item.path}"></path>
                    </svg>`;
                } else {
                    svgContent = `<div class="number-text">${item.num}</div>`;
                }
                
                card.innerHTML = `
                    ${svgContent}
                    <div class="word">${item.name}</div>
                    <div class="animals">
                        ${emojis}
                    </div>
                `;
            }

            container.appendChild(card);
        }

        function next() {
            index = (index + 1) % DATA.length;
            render();
        }

        function prev() {
            index = (index - 1 + DATA.length) % DATA.length;
            render();
        }

        function togglePlay() {
            playing = !playing;
            document.getElementById('playBtn').innerText = playing ? '⏸' : '▶';
            if (playing) {
                timer = setInterval(next, 5000); // 5 giây đổi thẻ để bé kịp đếm
            } else {
                clearInterval(timer);
            }
        }

        render();
    </script>
</body>
</html>
