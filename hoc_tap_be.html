<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tập Cùng Bé - Vui Học Thông Minh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(135deg, #FDF7F1 0%, #F0E8F6 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2C3E50;
            font-size: 2.2em;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: none;
            margin-bottom: 15px;
            animation: gentleBounce 3s ease-in-out infinite;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .container:hover h1,
        .container.show-nav h1 {
            opacity: 1;
        }

        @keyframes gentleBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.95; }
        }

        .tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 18px 15px;
            background: linear-gradient(180deg, #FFFFFF 0%, #F8F9FA 100%);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            border-bottom: 1px solid rgba(200, 210, 230, 0.4);
            box-shadow: none;
        }

        .container:hover .tabs,
        .container.show-nav .tabs {
            opacity: 1;
            pointer-events: auto;
        }

        .tab-button {
            padding: 11px 22px;
            font-size: 0.95em;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
            color: white;
            letter-spacing: 0.5px;
        }

        .tab-button:nth-child(1) {
            background: linear-gradient(135deg, #F4A89E 0%, #EE8E82 100%);
            box-shadow: none;
        }

        .tab-button:nth-child(2) {
            background: linear-gradient(135deg, #D4A5D4 0%, #C992C9 100%);
            box-shadow: none;
        }

        .tab-button:nth-child(3) {
            background: linear-gradient(135deg, #A8D5F0 0%, #8ECDE3 100%);
            color: #fff;
            box-shadow: none;
        }

        .tab-button:nth-child(4) {
            background: linear-gradient(135deg, #B8E6D5 0%, #A0DCC8 100%);
            color: #fff;
            box-shadow: none;
        }

        .tab-button:hover {
            transform: translateY(-2px);
            box-shadow: none;
        }

        .tab-button.active {
            transform: translateY(-3px);
            box-shadow: none;
        }

        .content-area {
            background: linear-gradient(135deg, #FDF7F1 0%, #F0E8F6 100%);
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s;
            padding: 80px 20px 120px 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .section-title {
            font-size: 1.4em;
            color: #2C3E50;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
            letter-spacing: 0.5px;
        }

        /* Single Item Display */
        .single-item-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 30px;
        }

        /* Color Item - Single Display */
        .color-item-large {
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            padding: 40px;
        }

        .color-box-large {
            width: 340px;
            height: 340px;
            margin: 0 auto 20px;
            border-radius: 50px;
            box-shadow: none;
            border: 10px solid white;
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            0% { transform: scale(0.7); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .color-name-large {
            font-size: 3em;
            font-weight: 600;
            color: #2C3E50;
            animation: slideUp 0.6s ease-out;
            letter-spacing: 1px;
        }

        /* Shape Item - Single Display */
        .shape-item-large {
            text-align: center;
            cursor: pointer;
            padding: 40px;
        }

        .shape-box-large {
            width: 520px;
            height: 520px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.6s ease-out;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.1));
        }

        .shape-box-large svg {
            width: 280px;
            height: 280px;
        }

        .shape-name-large {
            font-size: 3em;
            font-weight: 600;
            color: #2C3E50;
            margin-top: 30px;
            animation: slideUp 0.6s ease-out;
            letter-spacing: 1px;
        }

        /* Letter Item - Single Display */
        .letter-item-large {
            border-radius: 45px;
            padding: 70px 50px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: none;
            animation: scaleIn 0.6s ease-out;
            min-width: 450px;
        }

        .letter-item-large:active {
            transform: scale(0.98);
            box-shadow: none;
        }

        .letter-large {
            font-size: 9em;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 15px;
            animation: slideUp 0.6s ease-out;
            letter-spacing: 5px;
        }

        .animal-emoji-large {
            font-size: 8em;
            margin: 10px 0;
            animation: gentlePulse 2.5s ease-in-out infinite;
            display: inline-block;
        }

        .animal-name-large {
            font-size: 2.2em;
            color: #1a1a1a;
            margin-top: 20px;
            font-weight: 700;
            animation: slideUp 0.7s ease-out;
        }

        /* Number Item - Single Display */
        .number-item-large {
            border-radius: 45px;
            padding: 70px 50px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: none;
            animation: scaleIn 0.6s ease-out;
            min-width: 450px;
        }

        .number-item-large:active {
            transform: scale(0.98);
            box-shadow: none;
        }

        .number-large {
            font-size: 9em;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 15px;
            animation: slideUp 0.6s ease-out;
            letter-spacing: 3px;
        }

        .number-word-large {
            font-size: 2.2em;
            color: #1a1a1a;
            margin: 20px 0;
            font-weight: 700;
            animation: slideUp 0.7s ease-out;
        }

        .number-visual-large {
            font-size: 4.5em;
            margin-top: 15px;
            line-height: 1.3;
            animation: gentlePulse 2.5s ease-in-out infinite;
            letter-spacing: 2px;
        }

        /* SVG Shapes Dynamic Colors */
        svg .shape-element {
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2));
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.55) 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 98;
            backdrop-filter: blur(5px);
        }

        .container:hover .controls,
        .container.show-nav .controls {
            opacity: 1;
            pointer-events: auto;
        }

        .control-button {
            padding: 9px 15px;
            font-size: 0.8em;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: none;
            color: white;
        }

        .btn-prev {
            background: linear-gradient(135deg, #F4A89E 0%, #EE8E82 100%);
        }

        .btn-next {
            background: linear-gradient(135deg, #B8E6D5 0%, #A0DCC8 100%);
        }

        .btn-auto {
            background: linear-gradient(135deg, #C8E6C9 0%, #A8DB9B 100%);
            color: #fff;
        }

        .btn-random {
            background: linear-gradient(135deg, #FFCB7B 0%, #FFBA60 100%);
            color: #fff;
        }

        .control-button:hover {
            transform: translateY(-2px);
            box-shadow: none;
        }

        .control-button:active {
            transform: translateY(0);
        }

        .counter {
            font-size: 0.8em;
            color: #fff;
            font-weight: 600;
            text-align: center;
            min-width: 75px;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 10px;
            border-radius: 8px;
            backdrop-filter: blur(3px);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
                margin-bottom: 10px;
            }

            .tabs {
                padding: 10px 5px;
                gap: 5px;
            }

            .tab-button {
                padding: 10px 18px;
                font-size: 0.85em;
            }

            .content-area {
                padding: 0;
                min-height: 100vh;
            }

            .tab-content.active {
                padding: 70px 15px 100px 15px;
            }

            .section-title {
                font-size: 1.3em;
                margin-bottom: 15px;
            }

            .single-item-container {
                gap: 15px;
            }

            .color-box-large {
                width: 260px;
                height: 260px;
                margin: 0 auto 15px;
                border-radius: 35px;
            }

            .color-name-large {
                font-size: 2.2em;
            }

            .shape-box-large {
                width: 330px;
                height: 330px;
                margin: 0 auto 15px;
            }

            .shape-name-large {
                font-size: 2.2em;
            }

            .letter-item-large {
                padding: 50px 30px;
                min-width: 320px;
            }

            .letter-large {
                font-size: 6em;
                margin-bottom: 10px;
                letter-spacing: 3px;
            }

            .animal-emoji-large {
                font-size: 5.5em;
                margin: 8px 0;
            }

            .animal-name-large {
                font-size: 1.6em;
                margin-top: 8px;
            }

            .number-item-large {
                padding: 50px 30px;
                min-width: 320px;
            }

            .number-large {
                font-size: 6em;
                margin-bottom: 10px;
                letter-spacing: 2px;
            }

            .number-large {
                font-size: 5.5em;
                margin-bottom: 10px;
            }

            .number-word-large {
                font-size: 1.8em;
                margin: 10px 0;
            }

            .number-visual-large {
                font-size: 3em;
            }

            .controls {
                padding: 10px;
                gap: 8px;
            }

            .control-button {
                padding: 8px 12px;
                font-size: 0.75em;
            }

            .counter {
                font-size: 0.75em;
                min-width: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌈 Học Tập Cùng Bé 🌈</h1>
        
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab(0)">🎨 Màu Sắc</button>
            <button class="tab-button" onclick="switchTab(1)">⭐ Hình Dạng</button>
            <button class="tab-button" onclick="switchTab(2)">🔤 Bảng Chữ Cái</button>
            <button class="tab-button" onclick="switchTab(3)">🔢 Tập Đếm</button>
        </div>

        <div class="content-area">
            <!-- Tab 0: Màu sắc -->
            <div class="tab-content active" id="tab-0">
                <div class="section-title">🎨 Màu Sắc</div>
                <div class="single-item-container" id="color-display"></div>
                <div class="controls">
                    <button class="control-button btn-prev" onclick="colorPrev()">← Trước</button>
                    <div class="counter"><span id="color-counter">1</span> / <span id="color-total">11</span></div>
                    <button class="control-button btn-next" onclick="colorNext()">Sau →</button>
                    <button class="control-button btn-auto" id="color-auto-btn" onclick="toggleColorAuto()">🎬 Tự động</button>
                    <button class="control-button btn-random" onclick="randomColor()">🎲 Random</button>
                </div>
            </div>

            <!-- Tab 1: Hình dạng -->
            <div class="tab-content" id="tab-1">
                <div class="section-title">⭐ Hình Dạng</div>
                <div class="single-item-container" id="shape-display"></div>
                <div class="controls">
                    <button class="control-button btn-prev" onclick="shapePrev()">← Trước</button>
                    <div class="counter"><span id="shape-counter">1</span> / <span id="shape-total">7</span></div>
                    <button class="control-button btn-next" onclick="shapeNext()">Sau →</button>
                    <button class="control-button btn-auto" id="shape-auto-btn" onclick="toggleShapeAuto()">🎬 Tự động</button>
                    <button class="control-button btn-random" onclick="randomShape()">🎲 Random</button>
                </div>
            </div>

            <!-- Tab 2: Bảng chữ cái -->
            <div class="tab-content" id="tab-2">
                <div class="section-title">🔤 Bảng Chữ Cái Tiếng Anh</div>
                <div class="single-item-container" id="alphabet-display"></div>
                <div class="controls">
                    <button class="control-button btn-prev" onclick="alphabetPrev()">← Trước</button>
                    <div class="counter"><span id="alphabet-counter">1</span> / <span id="alphabet-total">26</span></div>
                    <button class="control-button btn-next" onclick="alphabetNext()">Sau →</button>
                    <button class="control-button btn-auto" id="alphabet-auto-btn" onclick="toggleAlphabetAuto()">🎬 Tự động</button>
                    <button class="control-button btn-random" onclick="randomAlphabet()">🎲 Random</button>
                </div>
            </div>

            <!-- Tab 3: Tập đếm -->
            <div class="tab-content" id="tab-3">
                <div class="section-title">🔢 Học Đếm Từ 1 Đến 10</div>
                <div class="single-item-container" id="counting-display"></div>
                <div class="controls">
                    <button class="control-button btn-prev" onclick="numberPrev()">← Trước</button>
                    <div class="counter"><span id="number-counter">1</span> / <span id="number-total">10</span></div>
                    <button class="control-button btn-next" onclick="numberNext()">Sau →</button>
                    <button class="control-button btn-auto" id="number-auto-btn" onclick="toggleNumberAuto()">🎬 Tự động</button>
                    <button class="control-button btn-random" onclick="randomNumber()">🎲 Random</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu màu sắc - Tối ưu cho tâm lý trẻ 3 tuổi
        const colors = [
            { name: 'Đỏ', code: '#FF1744' },
            { name: 'Xanh Dương', code: '#0066FF' },
            { name: 'Vàng', code: '#FFD600' },

        ];

        // Dữ liệu hình dạng với SVG
        const shapes = [
            { 
                name: 'Ngôi Sao', 
                svg: '<svg width="100" height="100" viewBox="0 0 100 100"><polygon class="shape-element" points="50,10 61,35 89,35 67,52 75,80 50,63 25,80 33,52 11,35 39,35"/></svg>'

            }
        ];

        // Dữ liệu bảng chữ cái với động vật
        const alphabet = [
            { letter: 'A', animal: 'Ant', vietnamese: 'Kiến', emoji: '🐜' },
            { letter: 'B', animal: 'Bear', vietnamese: 'Gấu', emoji: '🐻' },
            { letter: 'C', animal: 'Cat', vietnamese: 'Mèo', emoji: '🐱' },

            { letter: 'N', animal: 'Narwhal', vietnamese: 'Cá Voi Một Sừng', emoji: '🐋' },
            { letter: 'O', animal: 'Owl', vietnamese: 'Cú', emoji: '🦉' },

            { letter: 'S', animal: 'Snake', vietnamese: 'Rắn', emoji: '🐍' },

            { letter: 'U', animal: 'Unicorn', vietnamese: 'Kỳ Lân', emoji: '🦄' },

            { letter: 'W', animal: 'Whale', vietnamese: 'Cá Voi', emoji: '🐳' },
            { letter: 'X', animal: 'X-ray Fish', vietnamese: 'Cá X-ray', emoji: '🐠' },

            { letter: 'Z', animal: 'Zebra', vietnamese: 'Ngựa Vằn', emoji: '🦓' }
        ];

        // Dữ liệu số đếm
        const numbers = [
            { num: 1, word: 'Một', visual: '⭐' },
            { num: 2, word: 'Hai', visual: '⭐⭐' },
            { num: 3, word: 'Ba', visual: '⭐⭐⭐' },
            { num: 4, word: 'Bốn', visual: '⭐⭐⭐⭐' },
            { num: 5, word: 'Năm', visual: '⭐⭐⭐⭐⭐' },
            { num: 6, word: 'Sáu', visual: '⭐⭐⭐⭐⭐⭐' },
            { num: 7, word: 'Bảy', visual: '⭐⭐⭐⭐⭐⭐⭐' },
            { num: 8, word: 'Tám', visual: '⭐⭐⭐⭐⭐⭐⭐⭐' },
            { num: 9, word: 'Chín', visual: '⭐⭐⭐⭐⭐⭐⭐⭐⭐' },
            { num: 10, word: 'Mười', visual: '⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐' }
        ];

        // State management
        let colorIndex = 0;
        let shapeIndex = 0;
        let alphabetIndex = 0;
        let numberIndex = 0;

        let colorAutoPlay = false;
        let shapeAutoPlay = false;
        let alphabetAutoPlay = false;
        let numberAutoPlay = false;

        let colorAutoTimer;
        let shapeAutoTimer;
        let alphabetAutoTimer;
        let numberAutoTimer;

        // Hàm generate random color
        function getRandomColor() {
            const hue = Math.random() * 360;
            const saturation = 75 + Math.random() * 25;
            const lightness = 55 + Math.random() * 25;
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        // Hàm điều chỉnh màu (làm sáng hoặc tối hơn)
        function adjustColor(color, percent) {
            if (color.startsWith('#')) {
                const hex = color.substring(1);
                const num = parseInt(hex, 16);
                const amt = Math.round(2.55 * percent);
                const R = Math.min(255, Math.max(0, (num >> 16) + amt));
                const G = Math.min(255, Math.max(0, (num >> 8 & 0x00FF) + amt));
                const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
                return '#' + (0x1000000 + (R < 16 ? 0 : '') * R * 0x10000 + 
                             (G < 16 ? 0 : '') * G * 0x100 + (B < 16 ? 0 : '') * B).toString(16).slice(1);
            }
            return color;
        }

        // Chức năng phát âm bằng Web Speech API
        function speak(text, lang = 'vi-VN') {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.8;
                utterance.pitch = 1.2;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        // ========== COLOR FUNCTIONS ==========
        function displayColor(index) {
            const container = document.getElementById('color-display');
            const color = colors[index];
            container.innerHTML = `
                <div class="color-item-large" onclick="speak('${color.name}')">
                    <div class="color-box-large" style="background-color: ${color.code}; ${color.name === 'Trắng' ? 'border: 4px solid #ccc;' : ''}"></div>
                    <div class="color-name-large">${color.name}</div>
                </div>
            `;
            document.getElementById('color-counter').textContent = index + 1;
        }

        function colorNext() {
            colorIndex = (colorIndex + 1) % colors.length;
            displayColor(colorIndex);
        }

        function colorPrev() {
            colorIndex = (colorIndex - 1 + colors.length) % colors.length;
            displayColor(colorIndex);
        }

        function randomColor() {
            colorIndex = Math.floor(Math.random() * colors.length);
            displayColor(colorIndex);
        }

        function toggleColorAuto() {
            colorAutoPlay = !colorAutoPlay;
            const btn = document.getElementById('color-auto-btn');
            btn.style.opacity = colorAutoPlay ? '0.7' : '1';
            
            if (colorAutoPlay) {
                colorAutoTimer = setInterval(() => colorNext(), 2000);
            } else {
                clearInterval(colorAutoTimer);
            }
        }

        // ========== SHAPE FUNCTIONS ==========
        function displayShape(index) {
            const container = document.getElementById('shape-display');
            const shape = shapes[index];
            const randomColor = getRandomColor();
            
            let svgContent = shape.svg;
            // Thay thế màu cho SVG
            svgContent = svgContent.replace(/class="shape-element"/g, `class="shape-element" style="fill: ${randomColor}"`);
            
            container.innerHTML = `
                <div class="shape-item-large" onclick="speak('${shape.name}')">
                    <div class="shape-box-large">${svgContent}</div>
                    <div class="shape-name-large">${shape.name}</div>
                </div>
            `;
            document.getElementById('shape-counter').textContent = index + 1;
        }

        function shapeNext() {
            shapeIndex = (shapeIndex + 1) % shapes.length;
            displayShape(shapeIndex);
        }

        function shapePrev() {
            shapeIndex = (shapeIndex - 1 + shapes.length) % shapes.length;
            displayShape(shapeIndex);
        }

        function randomShape() {
            shapeIndex = Math.floor(Math.random() * shapes.length);
            displayShape(shapeIndex);
        }

        function toggleShapeAuto() {
            shapeAutoPlay = !shapeAutoPlay;
            const btn = document.getElementById('shape-auto-btn');
            btn.style.opacity = shapeAutoPlay ? '0.7' : '1';
            
            if (shapeAutoPlay) {
                shapeAutoTimer = setInterval(() => shapeNext(), 2000);
            } else {
                clearInterval(shapeAutoTimer);
            }
        }

        // ========== ALPHABET FUNCTIONS ==========
        function displayAlphabet(index) {
            const container = document.getElementById('alphabet-display');
            const item = alphabet[index];
            const colors = ['#F4A89E', '#A8D5F0', '#FFE5B4', '#B8E6D5', '#D4A5D4', '#FFCB7B', '#C8E6C9', '#F8B4D6'];
            const bgColor = colors[index % colors.length];
            
            container.innerHTML = `
                <div class="letter-item-large" style="background: ${bgColor};" onclick="handleAlphabetClick(${index})">
                    <div class="letter-large">${item.letter}</div>
                    <div class="animal-emoji-large">${item.emoji}</div>
                    <div class="animal-name-large">${item.animal}</div>
                    <div class="animal-name-large" style="font-size: 1.8em; margin-top: 8px; opacity: 1;">${item.vietnamese}</div>
                </div>
            `;
            document.getElementById('alphabet-counter').textContent = index + 1;
        }

        function handleAlphabetClick(index) {
            speak(alphabet[index].letter, 'en-US');
            setTimeout(() => speak(alphabet[index].vietnamese, 'vi-VN'), 800);
        }

        function alphabetNext() {
            alphabetIndex = (alphabetIndex + 1) % alphabet.length;
            displayAlphabet(alphabetIndex);
        }

        function alphabetPrev() {
            alphabetIndex = (alphabetIndex - 1 + alphabet.length) % alphabet.length;
            displayAlphabet(alphabetIndex);
        }

        function randomAlphabet() {
            alphabetIndex = Math.floor(Math.random() * alphabet.length);
            displayAlphabet(alphabetIndex);
        }

        function toggleAlphabetAuto() {
            alphabetAutoPlay = !alphabetAutoPlay;
            const btn = document.getElementById('alphabet-auto-btn');
            btn.style.opacity = alphabetAutoPlay ? '0.7' : '1';
            
            if (alphabetAutoPlay) {
                alphabetAutoTimer = setInterval(() => alphabetNext(), 2000);
            } else {
                clearInterval(alphabetAutoTimer);
            }
        }

        // ========== NUMBER FUNCTIONS ==========
        function displayNumber(index) {
            const container = document.getElementById('counting-display');
            const item = numbers[index];
            const colors = ['#F4A89E', '#A8D5F0', '#FFE5B4', '#B8E6D5', '#D4A5D4', '#FFCB7B', '#C8E6C9', '#F8B4D6', '#FFD7B5', '#E8C5E8'];
            const bgColor = colors[index % colors.length];
            
            container.innerHTML = `
                <div class="number-item-large" style="background: ${bgColor};" onclick="speak('${item.num}. ${item.word}')">
                    <div class="number-large">${item.num}</div>
                    <div class="number-word-large">${item.word}</div>
                    <div class="number-visual-large">${item.visual}</div>
                </div>
            `;
            document.getElementById('number-counter').textContent = index + 1;
        }

        function numberNext() {
            numberIndex = (numberIndex + 1) % numbers.length;
            displayNumber(numberIndex);
        }

        function numberPrev() {
            numberIndex = (numberIndex - 1 + numbers.length) % numbers.length;
            displayNumber(numberIndex);
        }

        function randomNumber() {
            numberIndex = Math.floor(Math.random() * numbers.length);
            displayNumber(numberIndex);
        }

        function toggleNumberAuto() {
            numberAutoPlay = !numberAutoPlay;
            const btn = document.getElementById('number-auto-btn');
            btn.style.opacity = numberAutoPlay ? '0.7' : '1';
            
            if (numberAutoPlay) {
                numberAutoTimer = setInterval(() => numberNext(), 2000);
            } else {
                clearInterval(numberAutoTimer);
            }
        }

        // Chuyển tab
        function switchTab(index) {
            document.querySelectorAll('.tab-button').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            
            document.querySelectorAll('.tab-content').forEach((content, i) => {
                content.classList.toggle('active', i === index);
            });

            // Dừng tất cả auto-play khi chuyển tab
            stopAllAutoPlay();
            
            // Hide nav after selection
            setTimeout(() => {
                document.querySelector('.container').classList.remove('show-nav');
            }, 300);
        }

        function stopAllAutoPlay() {
            colorAutoPlay = false;
            shapeAutoPlay = false;
            alphabetAutoPlay = false;
            numberAutoPlay = false;

            clearInterval(colorAutoTimer);
            clearInterval(shapeAutoTimer);
            clearInterval(alphabetAutoTimer);
            clearInterval(numberAutoTimer);

            document.getElementById('color-auto-btn').style.opacity = '1';
            document.getElementById('shape-auto-btn').style.opacity = '1';
            document.getElementById('alphabet-auto-btn').style.opacity = '1';
            document.getElementById('number-auto-btn').style.opacity = '1';
        }

        // Gesture controls
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, false);

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;

            // Horizontal swipe (left/right)
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                const activeTab = document.querySelector('.tab-content.active');
                if (activeTab.id === 'tab-0') {
                    if (diffX > 0) colorNext();
                    else colorPrev();
                } else if (activeTab.id === 'tab-1') {
                    if (diffX > 0) shapeNext();
                    else shapePrev();
                } else if (activeTab.id === 'tab-2') {
                    if (diffX > 0) alphabetNext();
                    else alphabetPrev();
                } else if (activeTab.id === 'tab-3') {
                    if (diffX > 0) numberNext();
                    else numberPrev();
                }
            }
            // Vertical swipe (up/down) to show/hide controls
            else if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 50) {
                const container = document.querySelector('.container');
                if (diffY > 0) {
                    container.classList.add('show-nav');
                } else {
                    container.classList.remove('show-nav');
                }
            }
        }, false);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            const activeTab = document.querySelector('.tab-content.active');
            
            if (e.key === 'ArrowRight') {
                if (activeTab.id === 'tab-0') colorNext();
                else if (activeTab.id === 'tab-1') shapeNext();
                else if (activeTab.id === 'tab-2') alphabetNext();
                else if (activeTab.id === 'tab-3') numberNext();
            } else if (e.key === 'ArrowLeft') {
                if (activeTab.id === 'tab-0') colorPrev();
                else if (activeTab.id === 'tab-1') shapePrev();
                else if (activeTab.id === 'tab-2') alphabetPrev();
                else if (activeTab.id === 'tab-3') numberPrev();
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const nav = document.querySelector('.container');
                nav.classList.toggle('show-nav');
            }
        });

        // Auto-hide navigation after 5 seconds of inactivity
        let navHideTimer;
        function resetNavHideTimer() {
            clearTimeout(navHideTimer);
            navHideTimer = setTimeout(() => {
                document.querySelector('.container').classList.remove('show-nav');
            }, 5000);
        }

        document.addEventListener('mousemove', resetNavHideTimer);
        document.addEventListener('touchstart', resetNavHideTimer);

        // Khởi tạo khi trang load
        window.onload = function() {
            displayColor(0);
            displayShape(0);
            displayAlphabet(0);
            displayNumber(0);

            // Set up total counts
            document.getElementById('color-total').textContent = colors.length;
            document.getElementById('shape-total').textContent = shapes.length;
            document.getElementById('alphabet-total').textContent = alphabet.length;
            document.getElementById('number-total').textContent = numbers.length;

            // Reset nav hide timer
            resetNavHideTimer();
        };
    </script>
</body>
</html>
